# fly.toml app configuration file generated for dockerize-ollama-app on 2025-05-02T11:40:40-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dockerize-ollama-app'
primary_region = 'sea'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy && npx prisma generate'

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[http_service.concurrency]
  type = "connections"
  hard_limit = 1000
  soft_limit = 500

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2

[metrics]
  port = 9091
  path = "/metrics"
